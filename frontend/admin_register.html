<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Registration | ResumeIQ-X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#030712;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow:hidden}
#bgCanvas{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:10;width:100%;max-width:460px}
.card{
  background:rgba(10,15,30,0.9);backdrop-filter:blur(32px);
  border:1px solid rgba(139,92,246,0.3);border-radius:28px;
  padding:2.5rem 2.2rem;
  box-shadow:0 40px 80px rgba(0,0,0,.7),0 0 60px rgba(139,92,246,.1) inset;
  animation:slideUp .6s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.admin-badge{
  display:flex;align-items:center;justify-content:center;gap:.6rem;
  background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.4);
  border-radius:100px;padding:.4rem 1.2rem;margin-bottom:1.5rem;
  font-size:.75rem;font-weight:700;letter-spacing:1.5px;color:#c4b5fd;text-transform:uppercase;
}
.card-logo{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:1.5rem}
.logo-icon{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:1.4rem;box-shadow:0 0 30px rgba(139,92,246,.6)}
.logo-text{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;font-weight:700;background:linear-gradient(135deg,#fff,#c4b5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{text-align:center;font-size:1.5rem;font-weight:700;color:#f1f5f9;margin-bottom:.3rem}
.subtitle{text-align:center;color:rgba(255,255,255,.4);font-size:.88rem;margin-bottom:1.8rem}
.field{position:relative;margin-bottom:.9rem}
.field-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:.95rem;color:rgba(255,255,255,.3);pointer-events:none;transition:color .2s}
.field:focus-within .field-icon{color:#8b5cf6}
input{
  width:100%;padding:.85rem 1rem .85rem 2.8rem;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;color:#f1f5f9;font-size:.92rem;font-family:'Inter',sans-serif;
  outline:none;transition:all .2s;
}
input:focus{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.5);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
input::placeholder{color:rgba(255,255,255,.25)}
input:-webkit-autofill,input:-webkit-autofill:focus{transition:background-color 600000s 0s,color 600000s 0s}
.btn{
  width:100%;padding:.95rem;margin-top:.5rem;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  color:#fff;border:none;border-radius:12px;
  font-size:1rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  box-shadow:0 0 30px rgba(139,92,246,.4);transition:all .25s;
}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 50px rgba(139,92,246,.6)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.msg{text-align:center;margin-top:.8rem;font-size:.85rem;min-height:2.2rem;display:flex;align-items:center;justify-content:center}
.error{color:#fca5a5;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);padding:.4rem .9rem;border-radius:8px;display:inline-block}
.success{color:#86efac;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);padding:.4rem .9rem;border-radius:8px;display:inline-block}
.link-row{text-align:center;margin-top:1.2rem}
.link-row a{color:rgba(196,181,253,.6);font-size:.85rem;text-decoration:none;transition:color .2s}
.link-row a:hover{color:#c4b5fd}
.back-link{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:1.5rem;color:rgba(255,255,255,.3);font-size:.85rem;text-decoration:none;transition:color .2s}
.back-link:hover{color:rgba(255,255,255,.6)}
/* OTP styles */
.field-row{display:flex;gap:.5rem;align-items:flex-start}
.field-row .field{flex:1;margin-bottom:0}
.field-status{position:absolute;right:.9rem;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none}
.otp-row{display:none;gap:.4rem;margin-top:.5rem;align-items:center}
.otp-row.show{display:flex}
.otp-input{flex:1;padding:.75rem 1rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#f1f5f9;font-size:.9rem;font-family:'Inter',sans-serif;outline:none;transition:all .2s;letter-spacing:4px;text-align:center}
.otp-input:focus{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.5);box-shadow:0 0 0 3px rgba(139,92,246,.15)}
.otp-btn{padding:.75rem 1rem;background:rgba(139,92,246,.2);border:1px solid rgba(139,92,246,.4);border-radius:10px;color:#c4b5fd;font-size:.82rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap}
.otp-btn:hover:not(:disabled){background:rgba(139,92,246,.35);color:#fff}
.otp-btn:disabled{opacity:.4;cursor:not-allowed}
.send-btn{padding:.82rem 1rem;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);border-radius:10px;color:#c4b5fd;font-size:.8rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;white-space:nowrap;flex-shrink:0}
.send-btn:hover:not(:disabled){background:rgba(139,92,246,.3);color:#fff}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.verified-badge{display:none;align-items:center;gap:.4rem;font-size:.78rem;font-weight:600;color:#34d399;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:.35rem .7rem;margin-top:.4rem}
.verified-badge.show{display:flex}
.otp-error{display:none;font-size:.78rem;color:#fca5a5;margin-top:.3rem;padding:.3rem .6rem;background:rgba(239,68,68,.1);border-radius:6px}
.otp-error.show{display:block}
/* Country code */
.mobile-field{display:flex;align-items:center;gap:0;position:relative}
.country-select-wrap{flex-shrink:0}
.country-select-wrap select{width:auto;padding:.82rem .5rem .82rem .7rem;border-radius:12px 0 0 12px;border-right:none;font-size:.82rem;cursor:pointer;min-width:90px}
.mobile-field input{border-radius:0 12px 12px 0;padding-left:1rem}
.mobile-field .field-status{right:.9rem}</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
  <div class="card">
    <div class="admin-badge">🛡️ Admin Registration</div>
    <div class="card-logo">
      <div class="logo-icon">👑</div>
      <span class="logo-text">ResumeIQ-X</span>
    </div>
    <h2>Create Admin Account</h2>
    <p class="subtitle">Register for enterprise admin access</p>

    <div class="field"><span class="field-icon">👤</span><input id="name" placeholder="Admin full name" autocomplete="name"></div>

    <!-- Email + OTP -->
    <div class="field-row">
      <div class="field">
        <span class="field-icon">📧</span>
        <input type="email" id="email" placeholder="Admin email" autocomplete="email">
        <span class="field-status" id="emailStatus"></span>
      </div>
      <button class="send-btn" id="sendEmailOtpBtn" onclick="sendEmailOtp()">Send OTP</button>
    </div>
    <div class="otp-row" id="emailOtpRow">
      <input class="otp-input" id="emailOtp" placeholder="Email OTP" maxlength="6" inputmode="numeric">
      <button class="otp-btn" onclick="verifyEmailOtp()">Verify</button>
    </div>
    <div class="verified-badge" id="emailVerifiedBadge">✓ Email verified</div>
    <div class="otp-error" id="emailOtpError"></div>

    <!-- Mobile + OTP -->
    <div class="field-row" style="margin-top:.8rem">
      <div class="field mobile-field">
        <div class="country-select-wrap">
          <select id="countryCode" onchange="updateFlag()">
            <option value="+91" data-flag="🇮🇳">🇮🇳 +91</option>
            <option value="+1" data-flag="🇺🇸">🇺🇸 +1</option>
            <option value="+44" data-flag="🇬🇧">🇬🇧 +44</option>
            <option value="+61" data-flag="🇦🇺">🇦🇺 +61</option>
            <option value="+971" data-flag="🇦🇪">🇦🇪 +971</option>
            <option value="+65" data-flag="🇸🇬">🇸🇬 +65</option>
            <option value="+49" data-flag="🇩🇪">🇩🇪 +49</option>
            <option value="+33" data-flag="🇫🇷">🇫🇷 +33</option>
            <option value="+81" data-flag="🇯🇵">🇯🇵 +81</option>
            <option value="+86" data-flag="🇨🇳">🇨🇳 +86</option>
            <option value="+92" data-flag="🇵🇰">🇵🇰 +92</option>
            <option value="+880" data-flag="🇧🇩">🇧🇩 +880</option>
            <option value="+94" data-flag="🇱🇰">🇱🇰 +94</option>
            <option value="+977" data-flag="🇳🇵">🇳🇵 +977</option>
          </select>
        </div>
        <input id="mobile" placeholder="Mobile number" autocomplete="tel" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
        <span class="field-status" id="mobileStatus"></span>
      </div>
      <button class="send-btn" id="sendMobileOtpBtn" onclick="sendMobileOtp()">Send OTP</button>
    </div>
    <div class="otp-row" id="mobileOtpRow">
      <input class="otp-input" id="mobileOtp" placeholder="Mobile OTP" maxlength="6" inputmode="numeric">
      <button class="otp-btn" onclick="verifyMobileOtp()">Verify</button>
    </div>
    <div class="verified-badge" id="mobileVerifiedBadge">✓ Mobile verified</div>
    <div class="otp-error" id="mobileOtpError"></div>

    <div class="field" style="margin-top:.8rem"><span class="field-icon">🔒</span><input type="password" id="password" placeholder="Password (min 6 chars)" autocomplete="new-password"></div>

    <button class="btn" id="btn" onclick="registerAdmin()">Register Admin Account →</button>
    <div id="msg" class="msg"></div>
    <div class="link-row"><a href="admin_login.html">Already have an account? Sign in</a></div>
  </div>
  <a href="index.html" class="back-link">← Back to home</a>
</div>

<script src="js/api.js"></script>
<script>
const canvas=document.getElementById('bgCanvas');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#030712';ctx.fillRect(0,0,W,H);
  [[.2,.3,400,'139,92,246',.14],[.8,.7,350,'99,102,241',.08]].forEach(([x,y,r,c,a])=>{
    const g=ctx.createRadialGradient(x*W,y*H,0,x*W,y*H,r);
    g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  });
  requestAnimationFrame(draw);
}
draw();

async function registerAdmin(){
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const mobile=document.getElementById('mobile').value.trim();
  const password=document.getElementById('password').value.trim();
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btn');
  msg.innerHTML='';
  if(!name||!email||!mobile||!password){msg.innerHTML="<span class='error'>All fields required</span>";return}
  if(!emailVerified){msg.innerHTML="<span class='error'>Please verify your email first</span>";return}
  if(!mobileVerified){msg.innerHTML="<span class='error'>Please verify your mobile number first</span>";return}
  if(password.length<6){msg.innerHTML="<span class='error'>Password must be 6+ characters</span>";return}
  btn.disabled=true;btn.textContent='Registering...';
  try{
    const res=await fetch(apiUrl('admin_register.php'),{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'name='+encodeURIComponent(name)+'&email='+encodeURIComponent(email)+'&mobile='+encodeURIComponent(mobile)+'&password='+encodeURIComponent(password)
    });
    const result=await res.json();
    if(!result.status){msg.innerHTML="<span class='error'>"+result.message+"</span>";btn.disabled=false;btn.textContent='Register Admin Account →';return}
    msg.innerHTML="<span class='success'>✓ Admin registered! You can now log in.</span>";
    setTimeout(()=>window.location.href='admin_login.html',1500);
  }catch(e){msg.innerHTML="<span class='error'>Server error</span>";btn.disabled=false;btn.textContent='Register Admin Account →'}
}

let emailVerified=false,mobileVerified=false;

async function sendEmailOtp(){
  const email=document.getElementById('email').value.trim();
  if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showOtpError('emailOtpError','Enter a valid email first');return}
  const btn=document.getElementById('sendEmailOtpBtn');
  btn.disabled=true;btn.textContent='Sending...';
  try{
    const res=await fetch(apiUrl('send_otp.php'),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'type=email&email='+encodeURIComponent(email)});
    const data=await res.json();
    if(data.status){document.getElementById('emailOtpRow').classList.add('show');hideOtpError('emailOtpError');btn.textContent='Resend';startCooldown(btn,60)}
    else{showOtpError('emailOtpError',data.message||'Failed');btn.disabled=false;btn.textContent='Send OTP'}
  }catch(e){showOtpError('emailOtpError','Server error');btn.disabled=false;btn.textContent='Send OTP'}
}

async function verifyEmailOtp(){
  const email=document.getElementById('email').value.trim();
  const otp=document.getElementById('emailOtp').value.trim();
  if(otp.length!==6){showOtpError('emailOtpError','Enter 6-digit OTP');return}
  try{
    const res=await fetch(apiUrl('send_otp.php'),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'type=verify_email&email='+encodeURIComponent(email)+'&otp='+encodeURIComponent(otp)});
    const data=await res.json();
    if(data.status){emailVerified=true;document.getElementById('emailStatus').textContent='✅';document.getElementById('emailVerifiedBadge').classList.add('show');document.getElementById('emailOtpRow').classList.remove('show');hideOtpError('emailOtpError')}
    else{showOtpError('emailOtpError',data.message||'Invalid OTP');document.getElementById('emailStatus').textContent='❌'}
  }catch(e){showOtpError('emailOtpError','Server error')}
}

async function sendMobileOtp(){
  const email=document.getElementById('email').value.trim();
  const mobile=document.getElementById('mobile').value.trim();
  if(!email){showOtpError('mobileOtpError','Enter email first');return}
  if(!/^[0-9]{10}$/.test(mobile)){showOtpError('mobileOtpError','Enter valid 10-digit mobile');return}
  const btn=document.getElementById('sendMobileOtpBtn');
  btn.disabled=true;btn.textContent='Sending...';
  try{
    const res=await fetch(apiUrl('send_otp.php'),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'type=mobile&email='+encodeURIComponent(email)+'&mobile='+encodeURIComponent(mobile)});
    const data=await res.json();
    if(data.status){document.getElementById('mobileOtpRow').classList.add('show');hideOtpError('mobileOtpError');btn.textContent='Resend';startCooldown(btn,60)}
    else{showOtpError('mobileOtpError',data.message||'Failed');btn.disabled=false;btn.textContent='Send OTP'}
  }catch(e){showOtpError('mobileOtpError','Server error');btn.disabled=false;btn.textContent='Send OTP'}
}

async function verifyMobileOtp(){
  const email=document.getElementById('email').value.trim();
  const otp=document.getElementById('mobileOtp').value.trim();
  if(otp.length!==6){showOtpError('mobileOtpError','Enter 6-digit OTP');return}
  try{
    const res=await fetch(apiUrl('send_otp.php'),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'type=verify_mobile&email='+encodeURIComponent(email)+'&otp='+encodeURIComponent(otp)});
    const data=await res.json();
    if(data.status){mobileVerified=true;document.getElementById('mobileStatus').textContent='✅';document.getElementById('mobileVerifiedBadge').classList.add('show');document.getElementById('mobileOtpRow').classList.remove('show');hideOtpError('mobileOtpError')}
    else{showOtpError('mobileOtpError',data.message||'Invalid OTP');document.getElementById('mobileStatus').textContent='❌'}
  }catch(e){showOtpError('mobileOtpError','Server error')}
}

function showOtpError(id,msg){const el=document.getElementById(id);el.textContent=msg;el.classList.add('show')}
function hideOtpError(id){document.getElementById(id).classList.remove('show')}
function startCooldown(btn,secs){let s=secs;const t=setInterval(()=>{s--;btn.textContent=`Resend (${s}s)`;if(s<=0){clearInterval(t);btn.disabled=false;btn.textContent='Resend'}},1000)}
</script>
</body>
</html>
