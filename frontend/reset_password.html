<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | ResumeIQ-X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#030712;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow:hidden}
#bgCanvas{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:10;width:100%;max-width:420px}
.card{
  background:rgba(15,23,42,0.85);backdrop-filter:blur(32px);
  border:1px solid rgba(99,102,241,0.25);border-radius:28px;
  padding:2.8rem 2.4rem;
  box-shadow:0 40px 80px rgba(0,0,0,.6);
  animation:slideUp .6s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.card-logo{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:1.8rem}
.logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 0 24px rgba(99,102,241,.5)}
.logo-text{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#fff,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-wrap{text-align:center;margin-bottom:1.5rem}
.big-icon{font-size:3rem;display:block;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h2{text-align:center;font-size:1.6rem;font-weight:700;color:#f1f5f9;margin-bottom:.4rem}
.subtitle{text-align:center;color:rgba(255,255,255,.4);font-size:.88rem;margin-bottom:2rem}
.field{position:relative;margin-bottom:1rem}
.field-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);font-size:.95rem;color:rgba(255,255,255,.3);pointer-events:none;transition:color .2s}
.field:focus-within .field-icon{color:#6366f1}
input{
  width:100%;padding:.9rem 1rem .9rem 2.8rem;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:12px;color:#f1f5f9;font-size:.95rem;font-family:'Inter',sans-serif;
  outline:none;transition:all .2s;
}
input:focus{background:rgba(99,102,241,.1);border-color:rgba(99,102,241,.5);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
input::placeholder{color:rgba(255,255,255,.3)}
input:-webkit-autofill,input:-webkit-autofill:focus{transition:background-color 600000s 0s,color 600000s 0s}
.btn{
  width:100%;padding:1rem;margin-top:.5rem;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;border:none;border-radius:12px;
  font-size:1rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
  box-shadow:0 0 30px rgba(99,102,241,.4);transition:all .25s;
}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 50px rgba(99,102,241,.6)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
#msg{text-align:center;margin-top:1rem;font-size:.85rem;min-height:2.2rem;display:flex;align-items:center;justify-content:center}
.error{color:#fca5a5;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);padding:.4rem .9rem;border-radius:8px;display:inline-block}
.success{color:#86efac;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);padding:.4rem .9rem;border-radius:8px;display:inline-block}
#invalidToken{text-align:center;padding:1.5rem}
#invalidToken p{color:#fca5a5;margin-bottom:1rem;font-size:1rem}
#invalidToken a{color:#a5b4fc;text-decoration:none;font-weight:600}
.back-link{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-top:1.5rem;color:rgba(255,255,255,.3);font-size:.85rem;text-decoration:none;transition:color .2s}
.back-link:hover{color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
  <div class="card">
    <div class="card-logo">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">ResumeIQ-X</span>
    </div>

    <div id="invalidToken" style="display:none">
      <span style="font-size:3rem">⚠️</span>
      <p>Invalid or expired reset link.</p>
      <a href="forgot_password.html">Request a new reset link →</a>
    </div>

    <div id="formArea">
      <div class="icon-wrap"><span class="big-icon">🔑</span></div>
      <h2>Set New Password</h2>
      <p class="subtitle">Choose a strong password for your account</p>

      <div class="field"><span class="field-icon">🔒</span><input type="password" id="password" placeholder="New password (min 6 chars)" autocomplete="new-password"></div>
      <div class="field"><span class="field-icon">🔒</span><input type="password" id="password2" placeholder="Confirm new password" autocomplete="new-password"></div>

      <button class="btn" id="btn" onclick="resetPassword()">Update Password →</button>
      <div id="msg"></div>
    </div>
  </div>
  <a href="index.html" class="back-link">← Back to home</a>
</div>

<script src="js/api.js"></script>
<script>
const canvas=document.getElementById('bgCanvas');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
function draw(){
  ctx.clearRect(0,0,W,H);ctx.fillStyle='#030712';ctx.fillRect(0,0,W,H);
  [[.2,.3,350,'99,102,241',.12],[.8,.7,300,'6,182,212',.08]].forEach(([x,y,r,c,a])=>{
    const g=ctx.createRadialGradient(x*W,y*H,0,x*W,y*H,r);
    g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  });
  requestAnimationFrame(draw);
}
draw();

const token=new URLSearchParams(window.location.search).get('token');
if(!token){
  document.getElementById('formArea').style.display='none';
  document.getElementById('invalidToken').style.display='block';
}

// Resolve backend URL using shared api.js helper
async function resetPassword(){
  const password=document.getElementById('password').value.trim();
  const password2=document.getElementById('password2').value.trim();
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btn');
  msg.innerHTML='';
  if(!password||!password2){msg.innerHTML="<span class='error'>Both fields are required</span>";return}
  if(password.length<6){msg.innerHTML="<span class='error'>Password must be at least 6 characters</span>";return}
  if(password!==password2){msg.innerHTML="<span class='error'>Passwords do not match</span>";return}
  btn.disabled=true;btn.textContent='Updating...';
  try{
    const res=await fetch(apiUrl('reset_password.php'),{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'token='+encodeURIComponent(token)+'&password='+encodeURIComponent(password)
    });
    const data=await res.json();
    if(!data.status){msg.innerHTML="<span class='error'>"+data.message+"</span>";btn.disabled=false;btn.textContent='Update Password →';return}
    msg.innerHTML="<span class='success'>✓ "+data.message+"</span>";
    setTimeout(()=>window.location.href=data.redirect||'user_login.html',2000);
  }catch(e){msg.innerHTML="<span class='error'>Server error. Please try again.</span>";btn.disabled=false;btn.textContent='Update Password →'}
}
</script>
</body>
</html>
