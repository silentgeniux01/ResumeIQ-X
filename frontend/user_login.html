<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | ResumeIQ-X</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter',sans-serif;
  background:#030712;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:1.5rem;overflow:hidden;position:relative;
}
#bgCanvas{position:fixed;inset:0;z-index:0}
.wrap{position:relative;z-index:10;width:100%;max-width:440px}

/* CARD */
.card{
  background:rgba(15,23,42,0.8);
  backdrop-filter:blur(32px);
  border:1px solid rgba(99,102,241,0.25);
  border-radius:28px;
  padding:2.8rem 2.4rem;
  box-shadow:0 40px 80px rgba(0,0,0,.6),0 0 0 1px rgba(99,102,241,.1) inset;
  animation:slideUp .6s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}

/* LOGO */
.card-logo{
  display:flex;align-items:center;justify-content:center;gap:.7rem;
  margin-bottom:2rem;
}
.logo-icon{
  width:44px;height:44px;border-radius:12px;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;
  box-shadow:0 0 24px rgba(99,102,241,.5);
}
.logo-text{
  font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:700;
  background:linear-gradient(135deg,#fff,#a5b4fc);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h2{
  text-align:center;font-size:1.6rem;font-weight:700;
  color:#f1f5f9;margin-bottom:.4rem;
}
.subtitle{text-align:center;color:rgba(255,255,255,.4);font-size:.9rem;margin-bottom:2rem}

/* INPUTS */
.field{position:relative;margin-bottom:1rem}
.field-icon{
  position:absolute;left:1rem;top:50%;transform:translateY(-50%);
  font-size:1rem;color:rgba(255,255,255,.3);pointer-events:none;
  transition:color .2s;
}
.field:focus-within .field-icon{color:#6366f1}
input{
  width:100%;padding:.9rem 1rem .9rem 2.8rem;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:12px;
  color:#f1f5f9;font-size:.95rem;font-family:'Inter',sans-serif;
  outline:none;transition:all .2s;
}
input:focus{
  background:rgba(99,102,241,.1);
  border-color:rgba(99,102,241,.5);
  box-shadow:0 0 0 3px rgba(99,102,241,.15);
}
input::placeholder{color:rgba(255,255,255,.3)}
input:-webkit-autofill,input:-webkit-autofill:focus{
  transition:background-color 600000s 0s,color 600000s 0s;
}

/* BUTTON */
.btn{
  width:100%;padding:1rem;margin-top:.5rem;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;border:none;border-radius:12px;
  font-size:1rem;font-weight:600;cursor:pointer;
  font-family:'Inter',sans-serif;
  box-shadow:0 0 30px rgba(99,102,241,.4);
  transition:all .25s;position:relative;overflow:hidden;
}
.btn::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.1),transparent);
  opacity:0;transition:opacity .2s;
}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 0 50px rgba(99,102,241,.6)}
.btn:hover::before{opacity:1}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* MESSAGE */
.msg{
  text-align:center;margin-top:1rem;
  font-size:.85rem;min-height:2.5rem;
  display:flex;align-items:center;justify-content:center;
}
.error{
  color:#fca5a5;background:rgba(239,68,68,.15);
  border:1px solid rgba(239,68,68,.3);
  padding:.5rem 1rem;border-radius:8px;display:inline-block;
}
.success{
  color:#86efac;background:rgba(34,197,94,.15);
  border:1px solid rgba(34,197,94,.3);
  padding:.5rem 1rem;border-radius:8px;display:inline-block;
}

/* DIVIDER */
.divider{
  display:flex;align-items:center;gap:1rem;margin:1.2rem 0;
}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.08)}
.divider span{font-size:.8rem;color:rgba(255,255,255,.3)}

/* LINKS */
.links{display:flex;justify-content:space-between;margin-top:1.2rem}
.links a{
  color:rgba(165,180,252,.7);font-size:.85rem;text-decoration:none;
  transition:color .2s;
}
.links a:hover{color:#a5b4fc}

/* BACK */
.back-link{
  display:flex;align-items:center;justify-content:center;gap:.4rem;
  margin-top:1.5rem;
  color:rgba(255,255,255,.3);font-size:.85rem;text-decoration:none;
  transition:color .2s;
}
.back-link:hover{color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="wrap">
  <div class="card">
    <div class="card-logo">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">ResumeIQ-X</span>
    </div>
    <h2>Welcome back</h2>
    <p class="subtitle">Sign in to your intelligence workspace</p>

    <div class="field">
      <span class="field-icon">📧</span>
      <input type="email" id="email" placeholder="Email address" autocomplete="username">
    </div>
    <div class="field">
      <span class="field-icon">🔒</span>
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    </div>

    <button class="btn" id="btn" onclick="loginUser()">Sign In →</button>

    <div id="msg" class="msg"></div>

    <div class="divider"><span>or</span></div>

    <div class="links">
      <a href="register.html">Create account</a>
      <a href="forgot_password.html">Forgot password?</a>
    </div>
  </div>
  <a href="index.html" class="back-link">← Back to home</a>
</div>

<script src="js/api.js"></script>
<script>
// CANVAS BG
const canvas=document.getElementById('bgCanvas');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
resize();window.addEventListener('resize',resize);
const orbs=[
  {x:.2,y:.3,r:350,c:'99,102,241',a:.12},
  {x:.8,y:.7,r:400,c:'6,182,212',a:.08},
  {x:.5,y:.1,r:250,c:'139,92,246',a:.1}
];
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#030712';ctx.fillRect(0,0,W,H);
  orbs.forEach(o=>{
    const g=ctx.createRadialGradient(o.x*W,o.y*H,0,o.x*W,o.y*H,o.r);
    g.addColorStop(0,`rgba(${o.c},${o.a})`);g.addColorStop(1,'transparent');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  });
  requestAnimationFrame(draw);
}
draw();

// LOGIN
async function loginUser(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value.trim();
  const msg=document.getElementById('msg');
  const btn=document.getElementById('btn');
  msg.innerHTML='';
  if(!email||!password){msg.innerHTML="<span class='error'>Email and password are required</span>";return}
  btn.disabled=true;btn.textContent='Signing in...';
  try{
    const res=await fetch(apiUrl('login_user.php'),{
      method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'email='+encodeURIComponent(email)+'&password='+encodeURIComponent(password)
    });
    const result=await res.json();
    if(!result.status){
      if(result.needs_verification&&result.email){
        msg.innerHTML="<span class='error'>"+result.message+"</span>";
        sessionStorage.setItem('verify_email',result.email);
        setTimeout(()=>window.location.href='verify_email.html?email='+encodeURIComponent(result.email),2000);
        btn.disabled=false;btn.textContent='Sign In →';return;
      }
      msg.innerHTML="<span class='error'>"+result.message+"</span>";
      btn.disabled=false;btn.textContent='Sign In →';return;
    }
    msg.innerHTML="<span class='success'>✓ Login successful — redirecting...</span>";
    setTimeout(()=>window.location.href=result.redirect||'candidate_my_status.php',1000);
  }catch(e){
    msg.innerHTML="<span class='error'>Server error. Please try again.</span>";
    btn.disabled=false;btn.textContent='Sign In →';
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')loginUser()});
</script>
</body>
</html>
